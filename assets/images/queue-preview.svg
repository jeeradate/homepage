<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="queueTitle queueDesc">
  <title id="queueTitle">Real-time queue management dashboard preview</title>
  <desc id="queueDesc">Dark interface showing now-serving ticket A-024 at counter 3, a live waiting list, and queue statistics.</desc>
  <defs>
    <linearGradient id="q-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="q-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="q-btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="q-glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="q-glow2">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="q-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="q-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#q-bg)"/>
  <rect width="1200" height="750" fill="url(#q-grid)"/>
  <circle cx="1030" cy="-40" r="440" fill="url(#q-glow)"/>
  <circle cx="120" cy="700" r="330" fill="url(#q-glow2)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <!-- Top bar -->
    <g transform="translate(56 34)">
      <rect width="34" height="34" rx="10" fill="url(#q-accent)"/>
      <text x="17" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#071018">jk</text>
      <text x="50" y="15" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="1">QUEUE OPS</text>
      <text x="50" y="29" font-size="9.5" fill="#94a3b8" letter-spacing="1.6">REAL-TIME MANAGEMENT</text>
    </g>
    <g transform="translate(972 39)">
      <circle cx="6" cy="10" r="5" fill="#34d399"/>
      <text x="20" y="14" font-family="Consolas, monospace" font-size="11" fill="#6ee7b7" letter-spacing="1.5">LIVE</text>
      <rect x="-58" y="-23" width="160" height="46" rx="12" fill="#0f172a" stroke="#1e293b"/>
    </g>
    <line x1="56" y1="94" x2="1144" y2="94" stroke="#1e293b"/>

    <!-- Main serving panel -->
    <rect x="56" y="120" width="720" height="382" rx="20" fill="#0d1526" stroke="#1e293b" filter="url(#q-shadow)"/>
    <rect x="56" y="120" width="720" height="4" rx="2" fill="url(#q-accent)"/>

    <text x="92" y="172" font-family="Consolas, monospace" font-size="11" fill="#94a3b8" letter-spacing="2">NOW SERVING</text>
    <text x="92" y="268" font-family="Consolas, monospace" font-size="82" font-weight="700" fill="#f8fafc" letter-spacing="-2">A-024</text>
    <text x="94" y="304" font-size="14" fill="#cbd5e1">Counter 03  <tspan fill="#475569">·</tspan>  General Medicine</text>
    <g transform="translate(94 334)">
      <rect width="186" height="34" rx="9" fill="#0b1220" stroke="#1e293b"/>
      <circle cx="18" cy="17" r="5" fill="#fbbf24"/>
      <text x="32" y="21" font-size="11.5" fill="#fcd34d">2 ahead · est. 8 min</text>
    </g>
    <g transform="translate(94 394)">
      <rect width="150" height="46" rx="11" fill="url(#q-btn)"/>
      <text x="75" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Call next  →</text>
      <rect x="164" y="0" width="104" height="46" rx="11" fill="#0b1220" stroke="#334155"/>
      <text x="216" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cbd5e1">Hold</text>
      <rect x="282" y="0" width="132" height="46" rx="11" fill="#0b1220" stroke="#0f766e"/>
      <text x="348" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5eead4">Complete</text>
    </g>

    <!-- Counter ring -->
    <g transform="translate(624 250)">
      <circle r="74" fill="none" stroke="#1e293b" stroke-width="12"/>
      <circle r="74" fill="none" stroke="url(#q-accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="310 465" transform="rotate(-90)"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#f8fafc">12</text>
      <text x="0" y="22" text-anchor="middle" font-size="10" fill="#94a3b8" letter-spacing="2">IN QUEUE</text>
      <text x="0" y="42" text-anchor="middle" font-size="10" fill="#5eead4" letter-spacing="1">SLA 96%</text>
    </g>

    <!-- Waiting list -->
    <rect x="800" y="120" width="344" height="382" rx="20" fill="#0d1526" stroke="#1e293b" filter="url(#q-shadow)"/>
    <text x="828" y="168" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" letter-spacing="1.6">WAITING LIST</text>
    <rect x="1054" y="148" width="62" height="26" rx="7" fill="#111c31" stroke="#1e293b"/>
    <text x="1085" y="165" text-anchor="middle" font-size="10" fill="#94a3b8">All 12</text>

    <g transform="translate(828 190)">
      <rect width="288" height="52" rx="11" fill="#111c31" stroke="#1e293b"/>
      <text x="16" y="24" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">A-025</text>
      <text x="16" y="40" font-size="10" fill="#94a3b8">General</text>
      <rect x="216" y="14" width="56" height="24" rx="6" fill="#0f2a2a"/>
      <text x="244" y="30" text-anchor="middle" font-size="9.5" fill="#5eead4">5 min</text>
    </g>
    <g transform="translate(828 252)">
      <rect width="288" height="52" rx="11" fill="#111c31" stroke="#1e293b"/>
      <text x="16" y="24" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">A-026</text>
      <text x="16" y="40" font-size="10" fill="#94a3b8">Pediatrics</text>
      <rect x="216" y="14" width="56" height="24" rx="6" fill="#2a2410"/>
      <text x="244" y="30" text-anchor="middle" font-size="9.5" fill="#fcd34d">9 min</text>
    </g>
    <g transform="translate(828 314)">
      <rect width="288" height="52" rx="11" fill="#111c31" stroke="#1e293b"/>
      <text x="16" y="24" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">A-027</text>
      <text x="16" y="40" font-size="10" fill="#94a3b8">General</text>
      <rect x="216" y="14" width="56" height="24" rx="6" fill="#111c31" stroke="#1e293b"/>
      <text x="244" y="30" text-anchor="middle" font-size="9.5" fill="#94a3b8">12 min</text>
    </g>

    <g transform="translate(828 386)">
      <rect width="288" height="92" rx="12" fill="#0b1a22" stroke="#134e4a"/>
      <text x="16" y="22" font-family="Consolas, monospace" font-size="9.5" fill="#5eead4" letter-spacing="1.4">PATIENT MOBILE VIEW</text>
      <text x="16" y="47" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#f8fafc">A-026</text>
      <text x="16" y="66" font-size="10" fill="#94a3b8">2 ahead · approx. 8 minutes</text>
      <rect x="206" y="34" width="66" height="42" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="239" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">TRACK</text>
      <text x="239" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#5eead4">LIVE</text>
    </g>

    <!-- Stats -->
    <g transform="translate(56 528)">
      <rect width="232" height="164" rx="16" fill="#0d1526" stroke="#1e293b"/>
      <text x="22" y="34" font-family="Consolas, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="1.4">AVG WAIT TIME</text>
      <text x="22" y="82" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#f8fafc">6m 20s</text>
      <text x="22" y="112" font-size="11" fill="#5eead4">↓ 18% vs yesterday</text>
      <rect x="22" y="128" width="188" height="6" rx="3" fill="#1e293b"/>
      <rect x="22" y="128" width="126" height="6" rx="3" fill="url(#q-accent)"/>
    </g>
    <g transform="translate(300 528)">
      <rect width="232" height="164" rx="16" fill="#0d1526" stroke="#1e293b"/>
      <text x="22" y="34" font-family="Consolas, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="1.4">SERVED TODAY</text>
      <text x="22" y="82" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#f8fafc">84</text>
      <text x="22" y="112" font-size="11" fill="#cbd5e1">across 3 counters</text>
      <g fill="#334155">
        <rect x="22" y="132" width="9" height="18" rx="2"/><rect x="36" y="124" width="9" height="26" rx="2"/>
        <rect x="50" y="128" width="9" height="22" rx="2"/><rect x="64" y="116" width="9" height="34" rx="2"/>
        <rect x="78" y="120" width="9" height="30" rx="2"/><rect x="92" y="110" width="9" height="40" rx="2"/>
        <rect x="106" y="114" width="9" height="36" rx="2"/><rect x="120" y="104" width="9" height="46" rx="2" fill="#818cf8"/>
      </g>
    </g>
    <g transform="translate(544 528)">
      <rect width="232" height="164" rx="16" fill="#0d1526" stroke="#1e293b"/>
      <text x="22" y="34" font-family="Consolas, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="1.4">NO-SHOW RATE</text>
      <text x="22" y="82" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#f8fafc">2.4%</text>
      <text x="22" y="112" font-size="11" fill="#5eead4">within target</text>
      <circle cx="184" cy="106" r="34" fill="none" stroke="#1e293b" stroke-width="8"/>
      <circle cx="184" cy="106" r="34" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-dasharray="5 208" transform="rotate(-90 184 106)"/>
    </g>
  </g>
</svg>
