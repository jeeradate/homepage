<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="spTitle spDesc">
  <title id="spTitle">Shopee seller order monitoring app preview</title>
  <desc id="spDesc">Dark notification dashboard showing new Shopee orders, an order feed, and today's sales summary.</desc>
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16100c"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="s-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="s-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="s-glow">
      <stop offset="0" stop-color="#f97316" stop-opacity=".3"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#94a3b8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="s-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#s-bg)"/>
  <rect width="1200" height="750" fill="url(#s-grid)"/>
  <circle cx="1090" cy="40" r="420" fill="url(#s-glow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <!-- Header -->
    <g transform="translate(56 34)">
      <rect width="34" height="34" rx="10" fill="url(#s-orange)"/>
      <text x="17" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#1a0b02">sp</text>
      <text x="50" y="15" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="1">SPAPP</text>
      <text x="50" y="29" font-size="9.5" fill="#a8a29e" letter-spacing="1.4">SHOPEE SELLER MONITOR</text>
    </g>
    <g transform="translate(1020 34)">
      <rect width="124" height="38" rx="10" fill="#1c1917" stroke="#44403c"/>
      <circle cx="22" cy="19" r="5" fill="#34d399"/>
      <text x="36" y="23" font-size="10.5" fill="#d6d3d1">Monitoring ON</text>
    </g>
    <line x1="56" y1="94" x2="1144" y2="94" stroke="#292524"/>

    <!-- Order feed -->
    <rect x="56" y="120" width="680" height="580" rx="20" fill="#141210" stroke="#292524" filter="url(#s-shadow)"/>
    <text x="88" y="166" font-family="Consolas, monospace" font-size="11" fill="#d6d3d1" letter-spacing="1.6">ORDER FEED</text>
    <g transform="translate(436 143)">
      <rect width="76" height="30" rx="8" fill="#231c16" stroke="#7c2d12"/>
      <text x="38" y="19" text-anchor="middle" font-size="10" fill="#fdba74">All 12</text>
      <rect x="84" width="76" height="30" rx="8" fill="#1c1917" stroke="#292524"/>
      <text x="122" y="19" text-anchor="middle" font-size="10" fill="#a8a29e">New 3</text>
      <rect x="168" width="108" height="30" rx="8" fill="#1c1917" stroke="#292524"/>
      <text x="222" y="19" text-anchor="middle" font-size="10" fill="#a8a29e">Packing 4</text>
    </g>

    <!-- Order rows -->
    <g transform="translate(88 188)">
      <rect width="616" height="104" rx="14" fill="#1b1714" stroke="#7c2d12"/>
      <rect x="18" y="20" width="48" height="48" rx="12" fill="url(#s-orange)"/>
      <text x="42" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#1a0b02">S</text>
      <text x="82" y="34" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#fafaf9">#240518</text>
      <text x="82" y="54" font-size="11" fill="#a8a29e">Beauty Bundle · 2 items</text>
      <text x="82" y="76" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#fdba74">THB 1,290</text>
      <rect x="502" y="20" width="94" height="26" rx="7" fill="#431407"/>
      <text x="549" y="37" text-anchor="middle" font-size="9.5" fill="#fb923c" letter-spacing="1">NEW ORDER</text>
      <text x="549" y="68" text-anchor="middle" font-size="10" fill="#78716c">09:41:22</text>
      <text x="82" y="94" font-size="9.5" fill="#57534e">Notification sent · Desktop + Web</text>
    </g>
    <g transform="translate(88 306)">
      <rect width="616" height="104" rx="14" fill="#151311" stroke="#292524"/>
      <rect x="18" y="20" width="48" height="48" rx="12" fill="#292524"/>
      <text x="42" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#a8a29e">S</text>
      <text x="82" y="34" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#fafaf9">#240517</text>
      <text x="82" y="54" font-size="11" fill="#a8a29e">Home &amp; Living · 1 item</text>
      <text x="82" y="76" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e7e5e4">THB 2,450</text>
      <rect x="502" y="20" width="94" height="26" rx="7" fill="#1c2b1a"/>
      <text x="549" y="37" text-anchor="middle" font-size="9.5" fill="#86efac" letter-spacing="1">PACKING</text>
      <text x="549" y="68" text-anchor="middle" font-size="10" fill="#78716c">09:38:07</text>
      <text x="82" y="94" font-size="9.5" fill="#57534e">Seller dashboard synced</text>
    </g>
    <g transform="translate(88 424)">
      <rect width="616" height="104" rx="14" fill="#151311" stroke="#292524"/>
      <rect x="18" y="20" width="48" height="48" rx="12" fill="#292524"/>
      <text x="42" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#a8a29e">S</text>
      <text x="82" y="34" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#fafaf9">#240516</text>
      <text x="82" y="54" font-size="11" fill="#a8a29e">Fashion · 3 items</text>
      <text x="82" y="76" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e7e5e4">THB 590</text>
      <rect x="502" y="20" width="94" height="26" rx="7" fill="#172033"/>
      <text x="549" y="37" text-anchor="middle" font-size="9.5" fill="#93c5fd" letter-spacing="1">SHIPPED</text>
      <text x="549" y="68" text-anchor="middle" font-size="10" fill="#78716c">09:12:44</text>
      <text x="82" y="94" font-size="9.5" fill="#57534e">Tracking number detected</text>
    </g>
    <g transform="translate(88 542)">
      <rect width="616" height="104" rx="14" fill="#151311" stroke="#292524"/>
      <rect x="18" y="20" width="48" height="48" rx="12" fill="#292524"/>
      <text x="42" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#a8a29e">S</text>
      <text x="82" y="34" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#fafaf9">#240515</text>
      <text x="82" y="54" font-size="11" fill="#a8a29e">Gadget · 1 item</text>
      <text x="82" y="76" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#e7e5e4">THB 3,990</text>
      <rect x="502" y="20" width="94" height="26" rx="7" fill="#431407"/>
      <text x="549" y="37" text-anchor="middle" font-size="9.5" fill="#fb923c" letter-spacing="1">NEW ORDER</text>
      <text x="549" y="68" text-anchor="middle" font-size="10" fill="#78716c">08:55:19</text>
      <text x="82" y="94" font-size="9.5" fill="#57534e">Notification sent · Desktop + Web</text>
    </g>

    <!-- Notification -->
    <rect x="760" y="120" width="384" height="340" rx="20" fill="#1a1512" stroke="#7c2d12" filter="url(#s-shadow)"/>
    <rect x="760" y="120" width="384" height="4" rx="2" fill="url(#s-btn)"/>
    <g transform="translate(792 154)">
      <rect width="52" height="52" rx="14" fill="url(#s-orange)"/>
      <path d="M26 14c-7 0-11 5-11 12v5l-3 6h28l-3-6v-5c0-7-4-12-11-12z" fill="#1a0b02"/>
      <circle cx="26" cy="40" r="3.5" fill="#1a0b02"/>
      <text x="68" y="18" font-family="Consolas, monospace" font-size="9.5" fill="#fdba74" letter-spacing="1.8">NEW ORDER DETECTED</text>
      <text x="68" y="42" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#fafaf9">#240518</text>
      <text x="68" y="60" font-size="11" fill="#a8a29e">Just now · 1 minute ago</text>
    </g>
    <g transform="translate(792 236)">
      <rect width="320" height="72" rx="12" fill="#11100e" stroke="#292524"/>
      <text x="18" y="26" font-size="10" fill="#78716c">ORDER TOTAL</text>
      <text x="18" y="54" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#fdba74">THB 1,290</text>
      <text x="302" y="54" text-anchor="end" font-size="10" fill="#86efac">PAID</text>
    </g>
    <g transform="translate(792 324)">
      <rect width="196" height="44" rx="10" fill="url(#s-btn)"/>
      <text x="98" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Open order  →</text>
      <rect x="208" y="0" width="112" height="44" rx="10" fill="#1c1917" stroke="#44403c"/>
      <text x="264" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#d6d3d1">Snooze 5m</text>
    </g>
    <text x="792" y="402" font-size="10" fill="#57534e">Sound alert · System tray · Mobile web</text>

    <!-- Today summary -->
    <rect x="760" y="480" width="384" height="220" rx="20" fill="#141210" stroke="#292524"/>
    <text x="792" y="518" font-family="Consolas, monospace" font-size="10" fill="#a8a29e" letter-spacing="1.6">TODAY'S SUMMARY</text>
    <g transform="translate(792 540)">
      <rect width="150" height="82" rx="12" fill="#1b1714" stroke="#292524"/>
      <text x="16" y="26" font-size="10" fill="#78716c">ORDERS</text>
      <text x="16" y="58" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#fafaf9">24</text>
      <text x="16" y="74" font-size="9.5" fill="#86efac">+6 new today</text>
    </g>
    <g transform="translate(956 540)">
      <rect width="156" height="82" rx="12" fill="#1b1714" stroke="#292524"/>
      <text x="16" y="26" font-size="10" fill="#78716c">REVENUE</text>
      <text x="16" y="58" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#fdba74">18,420</text>
      <text x="16" y="74" font-size="9.5" fill="#a8a29e">THB · all channels</text>
    </g>
    <g transform="translate(792 636)">
      <circle cx="6" cy="6" r="4" fill="#34d399"/>
      <text x="20" y="10" font-size="10" fill="#78716c">Next check in 30s</text>
      <text x="320" y="10" text-anchor="end" font-size="10" fill="#57534e">v1.4.0</text>
    </g>
  </g>
</svg>
