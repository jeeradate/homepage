<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="hTitle hDesc">
  <title id="hTitle">HotString Windows desktop automation preview</title>
  <desc id="hDesc">Dark utility interface showing custom hotkeys, text expansion presets, a PowerShell 7 terminal, and a Windows system tray bar.</desc>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111a"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="h-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="h-btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="h-glow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glow2">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="h-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#94a3b8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="h-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#h-bg)"/>
  <rect width="1200" height="750" fill="url(#h-grid)"/>
  <circle cx="90" cy="60" r="340" fill="url(#h-glow)"/>
  <circle cx="1140" cy="740" r="380" fill="url(#h-glow2)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <!-- Header -->
    <g transform="translate(56 34)">
      <rect width="34" height="34" rx="10" fill="url(#h-accent)"/>
      <text x="17" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#04121a">h</text>
      <text x="50" y="15" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="1">HOTSTRING</text>
      <text x="50" y="29" font-size="9.5" fill="#94a3b8" letter-spacing="1.4">WINDOWS DESKTOP AUTOMATION</text>
    </g>
    <g transform="translate(994 34)">
      <rect width="150" height="38" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="22" cy="19" r="5" fill="#34d399"/>
      <text x="36" y="23" font-size="10.5" fill="#cbd5e1">Tray agent running</text>
    </g>
    <line x1="56" y1="94" x2="1144" y2="94" stroke="#1e293b"/>

    <!-- Hotkey panel -->
    <rect x="56" y="120" width="640" height="520" rx="20" fill="#0c1520" stroke="#1e293b" filter="url(#h-shadow)"/>
    <text x="88" y="166" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" letter-spacing="1.6">HOTKEYS &amp; TEXT EXPANSION</text>
    <rect x="548" y="142" width="116" height="30" rx="8" fill="#0f2a2a" stroke="#134e4a"/>
    <text x="606" y="161" text-anchor="middle" font-size="10" fill="#5eead4">12 macros active</text>

    <g transform="translate(88 192)">
      <rect width="576" height="76" rx="12" fill="#111c31" stroke="#1e293b"/>
      <rect x="16" y="18" width="54" height="40" rx="8" fill="#0b1220" stroke="#334155"/>
      <text x="43" y="43" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#5eead4">F9</text>
      <text x="88" y="32" font-size="12.5" font-weight="600" fill="#f8fafc">Launch ERP Suite</text>
      <text x="88" y="52" font-size="10" fill="#94a3b8">เปิดโปรแกรมและ login preset ในคลิกเดียว</text>
      <rect x="492" y="24" width="68" height="28" rx="7" fill="#0f2a2a"/>
      <text x="526" y="42" text-anchor="middle" font-size="9.5" fill="#5eead4">ON</text>
    </g>
    <g transform="translate(88 280)">
      <rect width="576" height="76" rx="12" fill="#111c31" stroke="#1e293b"/>
      <rect x="16" y="18" width="120" height="40" rx="8" fill="#0b1220" stroke="#334155"/>
      <text x="76" y="43" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#5eead4">Ctrl + Alt + D</text>
      <text x="154" y="32" font-size="12.5" font-weight="600" fill="#f8fafc">Insert address block</text>
      <text x="154" y="52" font-size="10" fill="#94a3b8">ขยายข้อความ ;addr เป็นที่อยู่เต็ม</text>
      <rect x="492" y="24" width="68" height="28" rx="7" fill="#0f2a2a"/>
      <text x="526" y="42" text-anchor="middle" font-size="9.5" fill="#5eead4">ON</text>
    </g>
    <g transform="translate(88 368)">
      <rect width="576" height="76" rx="12" fill="#111c31" stroke="#1e293b"/>
      <rect x="16" y="18" width="64" height="40" rx="8" fill="#0b1220" stroke="#334155"/>
      <text x="48" y="43" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#5eead4">;inv</text>
      <text x="98" y="32" font-size="12.5" font-weight="600" fill="#f8fafc">Invoice template</text>
      <text x="98" y="52" font-size="10" fill="#94a3b8">พิมพ์เอกสารซ้ำ ๆ ด้วย template สำเร็จรูป</text>
      <rect x="492" y="24" width="68" height="28" rx="7" fill="#0f2a2a"/>
      <text x="526" y="42" text-anchor="middle" font-size="9.5" fill="#5eead4">ON</text>
    </g>
    <g transform="translate(88 456)">
      <rect width="576" height="76" rx="12" fill="#111c31" stroke="#1e293b"/>
      <rect x="16" y="18" width="112" height="40" rx="8" fill="#0b1220" stroke="#334155"/>
      <text x="72" y="43" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#5eead4">Shift + Win + T</text>
      <text x="146" y="32" font-size="12.5" font-weight="600" fill="#f8fafc">Start 25-minute focus timer</text>
      <text x="146" y="52" font-size="10" fill="#94a3b8">work interval timer พร้อมแจ้งเตือนเมื่อครบ</text>
      <rect x="492" y="24" width="68" height="28" rx="7" fill="#0f2a2a"/>
      <text x="526" y="42" text-anchor="middle" font-size="9.5" fill="#5eead4">ON</text>
    </g>

    <g transform="translate(88 556)">
      <rect width="576" height="58" rx="12" fill="#0b1a22" stroke="#134e4a"/>
      <circle cx="28" cy="29" r="9" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="42 15" transform="rotate(-90 28 29)"/>
      <text x="52" y="26" font-family="Consolas, monospace" font-size="10" fill="#5eead4" letter-spacing="1">WORK INTERVAL</text>
      <text x="52" y="43" font-size="11" fill="#cbd5e1">Focus session 18:42 remaining</text>
      <text x="548" y="35" text-anchor="end" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#f8fafc">18:42</text>
    </g>

    <!-- Terminal -->
    <rect x="720" y="120" width="424" height="330" rx="20" fill="#080d16" stroke="#1e293b" filter="url(#h-shadow)"/>
    <circle cx="748" cy="146" r="5" fill="#ff5f57"/>
    <circle cx="766" cy="146" r="5" fill="#febc2e"/>
    <circle cx="784" cy="146" r="5" fill="#28c840"/>
    <text x="1082" y="150" text-anchor="end" font-family="Consolas, monospace" font-size="9.5" fill="#64748b">PowerShell 7</text>
    <line x1="720" y1="166" x2="1144" y2="166" stroke="#1e293b"/>
    <g font-family="Consolas, monospace" font-size="11.5">
      <text x="748" y="202" fill="#5eead4">PS&gt;</text>
      <text x="780" y="202" fill="#cbd5e1">.\hotstring.ps1 -Profile work</text>
      <text x="748" y="232" fill="#34d399">[ok]</text>
      <text x="788" y="232" fill="#94a3b8">12 expansions loaded</text>
      <text x="748" y="258" fill="#34d399">[ok]</text>
      <text x="788" y="258" fill="#94a3b8">tray agent running</text>
      <text x="748" y="284" fill="#34d399">[ok]</text>
      <text x="788" y="284" fill="#94a3b8">timer 25:00 started</text>
      <text x="748" y="310" fill="#fcd34d">[warn]</text>
      <text x="798" y="310" fill="#94a3b8">hotkey F9 handed to ERP app</text>
      <text x="748" y="346" fill="#5eead4">PS&gt;</text>
      <rect x="780" y="336" width="7" height="13" fill="#5eead4"/>
    </g>
    <g transform="translate(748 374)">
      <rect width="368" height="48" rx="10" fill="#0c1520" stroke="#1e293b"/>
      <text x="16" y="20" font-family="Consolas, monospace" font-size="9" fill="#64748b" letter-spacing="1.2">ACTIVE PROFILE</text>
      <text x="16" y="37" font-size="11" fill="#cbd5e1">Work · SQLite presets · Sync enabled</text>
      <circle cx="350" cy="24" r="5" fill="#34d399"/>
    </g>

    <!-- Status cards -->
    <rect x="720" y="470" width="200" height="170" rx="16" fill="#0c1520" stroke="#1e293b"/>
    <text x="744" y="500" font-family="Consolas, monospace" font-size="9" fill="#94a3b8" letter-spacing="1.4">ENGINE</text>
    <text x="744" y="534" font-size="15" font-weight="700" fill="#f8fafc">AutoHotkey v2</text>
    <text x="744" y="556" font-size="10" fill="#94a3b8">Native hotkey handling</text>
    <rect x="744" y="578" width="152" height="6" rx="3" fill="#1e293b"/>
    <rect x="744" y="578" width="132" height="6" rx="3" fill="#2dd4bf"/>
    <text x="744" y="608" font-size="9.5" fill="#5eead4">Runs in system tray</text>

    <rect x="944" y="470" width="200" height="170" rx="16" fill="#0c1520" stroke="#1e293b"/>
    <text x="968" y="500" font-family="Consolas, monospace" font-size="9" fill="#94a3b8" letter-spacing="1.4">SCRIPTING</text>
    <text x="968" y="534" font-size="15" font-weight="700" fill="#f8fafc">PowerShell 7</text>
    <text x="968" y="556" font-size="10" fill="#94a3b8">Automation &amp; tasks</text>
    <rect x="968" y="578" width="152" height="6" rx="3" fill="#1e293b"/>
    <rect x="968" y="578" width="108" height="6" rx="3" fill="#818cf8"/>
    <text x="968" y="608" font-size="9.5" fill="#a5b4fc">No admin prompt</text>

    <!-- Taskbar -->
    <rect x="56" y="676" width="1088" height="44" rx="12" fill="#0b1220" stroke="#1e293b"/>
    <g transform="translate(72 686)">
      <rect width="24" height="24" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <rect x="5" y="5" width="6" height="6" rx="1" fill="#5eead4"/>
      <rect x="13" y="5" width="6" height="6" rx="1" fill="#818cf8"/>
      <rect x="5" y="13" width="6" height="6" rx="1" fill="#818cf8"/>
      <rect x="13" y="13" width="6" height="6" rx="1" fill="#5eead4"/>
    </g>
    <rect x="108" y="686" width="26" height="24" rx="6" fill="#0f2a2a" stroke="#134e4a"/>
    <text x="121" y="702" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#5eead4">h</text>
    <rect x="142" y="686" width="26" height="24" rx="6" fill="#111c31" stroke="#1e293b"/>
    <text x="155" y="702" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94a3b8">PS</text>
    <text x="1092" y="702" text-anchor="end" font-size="11" fill="#94a3b8">AHK v2 · PowerShell 7 · SQLite</text>
    <text x="1014" y="702" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">09:41</text>
  </g>
</svg>
